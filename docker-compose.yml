services:
  db:
    build:
      context: ./db
    image: ingrata-mssql:2022
    container_name: ingrata-db
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Define MSSQL_SA_PASSWORD en .env}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - ingrata-data:/var/opt/mssql
    healthcheck:
      test:
        - "CMD-SHELL"
        - >
          test -f /tmp/ingrata-scripts-done &&
          (/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "SELECT 1" -o /dev/null ||
          /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -b -Q "SELECT 1" -o /dev/null)
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ingrata-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: ${ConnectionStrings__Default:?Define ConnectionStrings__Default en .env}
      Jwt__Key: ${Jwt__Key:?Define Jwt__Key en .env}
      Jwt__ExpireMinutes: ${Jwt__ExpireMinutes:-30}
      Jwt__Issuer: ${Jwt__Issuer:-InventarioIngrata}
      Jwt__Audience: ${Jwt__Audience:-InventarioIngrata}
      App__TimeZone: ${App__TimeZone:-America/Mexico_City}
      App__PermitirMermaAlmacenista: ${App__PermitirMermaAlmacenista:-true}
      BOOTSTRAP_ADMIN_ID: ${BOOTSTRAP_ADMIN_ID:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      Cors__AllowedOrigin: ${CORS_ORIGIN:-http://localhost:4200}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ingrata-data:
